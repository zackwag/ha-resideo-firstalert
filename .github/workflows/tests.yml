name: Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  pytest:
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: "actions/checkout@v4"

      - name: Set up Python
        uses: "actions/setup-python@v5"
        with:
          # pytest-homeassistant-custom-component pins numpy==1.26.0, which
          # has no Python 3.13 wheel.
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests
        run: PYTHONPATH=custom_components python -m pytest tests/ -v
